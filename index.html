<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robot Warehouse | Wasm + NeonDB</title>
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0f1218;
            font-family: 'Segoe UI', sans-serif;
        }

        #app {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            flex-grow: 1;
        }

        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(15, 18, 24, 0.4);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(0, 255, 255, 0.15);
            border-radius: 16px;
            padding: 24px;
            color: #fff;
            pointer-events: none;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.6);
            min-width: 280px;
            transition: all 0.3s ease;
        }

        #hud h1 {
            margin: 0 0 20px 0;
            font-size: 16px;
            font-weight: 800;
            color: #00ffff;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
        }

        .stat {
            margin-bottom: 8px;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
        }

        .stat span {
            color: #888;
        }

        .val {
            color: #fff;
            font-family: monospace;
        }

        #db-status {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 50px;
            padding: 8px 20px;
            color: #fff;
            font-size: 12px;
            display: flex;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 10px;
            background: #555;
        }

        .dot.online {
            background: #00ff66;
            box-shadow: 0 0 10px #00ff66;
        }

        .dot.error {
            background: #ff3333;
            box-shadow: 0 0 10px #ff3333;
        }

        #controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
        }

        .btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            backdrop-filter: blur(10px);
        }

        .btn:hover {
            background: rgba(0, 255, 255, 0.1);
            border-color: #00ffff;
        }
    </style>
  <script type="module" crossorigin src="./assets/index-BN6Nu05H.js"></script>
</head>

<body>
    <div id="loading"
        style="position:fixed; top:0; left:0; width:100%; height:100%; background:#0f1218; display:flex; flex-direction:column; justify-content:center; align-items:center; z-index:9999; color:#00ffff; font-family:monospace;">
        <div style="font-size:24px; margin-bottom:20px; letter-spacing:5px;">INITIALIZING WAREHOUSE</div>
        <div id="loading-status" style="font-size:12px; opacity:0.6;">Connecting to MuJoCo Wasm...</div>
    </div>
    <div id="app">
        <div id="hud">
            <h1>Warehouse OS 3.1</h1>
            <div class="stat"><span>TIME</span><span class="val" id="time-val">0.00s</span></div>
            <div class="stat"><span>FRAMES</span><span class="val" id="frame-val">0</span></div>
            <div class="stat"><span>JOINTS</span><span class="val" id="joint-val">27 DOF</span></div>
            <hr style="border:0; border-top:1px solid rgba(255,255,255,0.1); margin:15px 0;">
            <div class="stat"><span>SOLVER</span><span class="val" id="solver-val">Newton</span></div>
            <div class="stat"><span>ENGINE</span><span class="val">MuJoCo Wasm</span></div>
        </div>

        <div id="db-status">
            <div id="status-dot" class="dot"></div>
            NEON DB: <span id="db-rows" style="margin-left:5px; font-family:monospace;">0 rows</span>
        </div>

        <div id="controls">
            <button class="btn" onclick="resetSim()">RESET SIMULATION (R)</button>
        </div>

        <canvas id="main-canvas"></canvas>
    </div>
</body>

</html>
